name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
  DD_ENV: ci-visibility-demo
  DD_TRACE_DEBUG: '0'
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: 1
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: 8
  DD_TEST_OPTIMIZATION_RUNNER_TEST_DISCOVERY_CACHE: .ddtest-cache/tests-discovery.json
  DD_TEST_OPTIMIZATION_RUNNER_TESTS_EXCLUDE_PATTERN: '**/ddtest/excluded/**/*'
  DD_TESTOPTIMIZATION_TIA_TEST_SKIPPING_MODE: suite
  DD_CIVISIBILITY_EARLY_FLAKE_DETECTION_ENABLED: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      python_matrix: ${{ steps.dd_plan_python.outputs.matrix }}
      javascript_matrix: ${{ steps.dd_plan_js.outputs.matrix }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Restore DDTest discovery cache
        id: ddtest_discovery_cache
        uses: actions/cache/restore@v4
        with:
          path: .ddtest-cache/tests-discovery.json
          key: ddtest-discovery-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ddtest-discovery-${{ runner.os }}-${{ github.ref_name }}-
            ddtest-discovery-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r python/requirements.txt
          cd javascript && npm ci

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Download ddtest binary
        run: |
          mkdir -p bin
          LATEST_PRERELEASE_TAG=$(gh release list --repo DataDog/ddtest --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1)
          gh release download "$LATEST_PRERELEASE_TAG" --repo DataDog/ddtest --pattern "ddtest-linux-amd64" --dir bin
          mv bin/ddtest-linux-amd64 bin/ddtest
          chmod +x bin/ddtest
        env:
          GH_TOKEN: ${{ github.token }}

      - id: dd_plan_python
        name: Setup Datadog Test Runner (Python)
        working-directory: python
        env:
          DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: python
          DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: pytest
          DD_SERVICE: pulse-api
        run: ../bin/ddtest plan --platform python --framework pytest --min-parallelism 1 --max-parallelism 8

      - id: dd_plan_js
        name: Setup Datadog Test Runner (JavaScript)
        working-directory: javascript
        env:
          DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: javascript
          DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: jest
          DD_SERVICE: pulse-frontend
        run: ../bin/ddtest plan --platform javascript --framework jest --min-parallelism 1 --max-parallelism 8 --tests-location "tests/**/*.test.js"

      - name: Verify DDTest exclude pattern
        run: |
          test -s .testoptimization/runner/test-files.txt || test -s python/.testoptimization/runner/test-files.txt
          if grep -Fq "exclude_pattern_canary" python/.testoptimization/runner/test-files.txt 2>/dev/null; then
            echo "DDTest exclude pattern did not filter the canary test" >&2
            exit 1
          fi

      - name: Stage latest DDTest discovery cache
        id: stage_ddtest_discovery_cache
        if: always()
        run: |
          if [ -f .testoptimization/tests-discovery/tests.json ]; then
            mkdir -p .ddtest-cache
            cp .testoptimization/tests-discovery/tests.json .ddtest-cache/tests-discovery.json
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          elif [ -f python/.testoptimization/tests-discovery/tests.json ]; then
            mkdir -p .ddtest-cache
            cp python/.testoptimization/tests-discovery/tests.json .ddtest-cache/tests-discovery.json
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save latest DDTest discovery cache
        if: always() && steps.stage_ddtest_discovery_cache.outputs.cache-ready == 'true' && steps.ddtest_discovery_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ddtest-cache/tests-discovery.json
          key: ${{ steps.ddtest_discovery_cache.outputs.cache-primary-key }}

      - name: Upload DD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-artifacts
          path: |
            .testoptimization
            python/.testoptimization
            javascript/.testoptimization
          if-no-files-found: warn
          include-hidden-files: true

  python-tests:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.python_matrix) }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Download DD artifacts
        uses: actions/download-artifact@v4
        with:
          name: dd-artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Download ddtest binary
        run: |
          mkdir -p bin
          LATEST_PRERELEASE_TAG=$(gh release list --repo DataDog/ddtest --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1)
          gh release download "$LATEST_PRERELEASE_TAG" --repo DataDog/ddtest --pattern "ddtest-linux-amd64" --dir bin
          mv bin/ddtest-linux-amd64 bin/ddtest
          chmod +x bin/ddtest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Python tests
        working-directory: python
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pulse-api
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
          PYTEST_ADDOPTS: --ddtrace
        run: ../bin/ddtest run --ci-node ${{ matrix.ci_node_index }} --platform python --framework pytest

  javascript-tests:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.javascript_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download DD artifacts
        uses: actions/download-artifact@v4
        with:
          name: dd-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: javascript
        run: npm ci

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Download ddtest binary
        run: |
          mkdir -p bin
          LATEST_PRERELEASE_TAG=$(gh release list --repo DataDog/ddtest --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1)
          gh release download "$LATEST_PRERELEASE_TAG" --repo DataDog/ddtest --pattern "ddtest-linux-amd64" --dir bin
          mv bin/ddtest-linux-amd64 bin/ddtest
          chmod +x bin/ddtest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run JavaScript tests
        working-directory: javascript
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pulse-frontend
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}
        run: ../bin/ddtest run --ci-node ${{ matrix.ci_node_index }} --platform javascript --framework jest

  e2e:
    runs-on: ubuntu-latest
    needs: [python-tests, javascript-tests]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r python/requirements.txt
          cd javascript && npm ci && npx playwright install chromium

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Start services
        env:
          PYTHONPATH: python/src
        run: |
          cd python && DATABASE_URL=postgresql://pulse:pulse@localhost:5432/pulse_test uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          cd javascript && npm run build && npm run preview -- --host 0.0.0.0 --port 5173 &
          sleep 8

      - name: Run Playwright E2E
        working-directory: javascript
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pulse-e2e
          PULSE_BASE_URL: http://localhost:5173
        run: npm run test:e2e
