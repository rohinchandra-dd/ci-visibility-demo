name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lint checks
        run: |
          echo "Running static analysis..."
          sleep 10
          echo "Lint passed"

  python-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run Python unit tests
        working-directory: python
        run: pytest tests/ -v -m "not slow"
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pr-checks-python

  javascript-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install dependencies
        working-directory: javascript
        run: npm ci

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run JavaScript unit tests
        working-directory: javascript
        run: npm run test:fast && npm run test:flaky
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pr-checks-javascript
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  report:
    runs-on: ubuntu-latest
    needs: [python-unit, javascript-unit]
    if: always()
    steps:
      - name: Aggregate results
        run: |
          echo "Python unit: ${{ needs.python-unit.result }}"
          echo "JavaScript unit: ${{ needs.javascript-unit.result }}"
          if [ "${{ needs.python-unit.result }}" != "success" ] || [ "${{ needs.javascript-unit.result }}" != "success" ]; then
            echo "One or more test jobs failed (expected due to flaky tests)"
            exit 1
          fi
          echo "All test jobs passed"
