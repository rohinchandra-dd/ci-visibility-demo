name: CI Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - 'demo/baseline-*'

concurrency:
  group: ci-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
  DD_ENV: ci-visibility-demo
  DD_CIVISIBILITY_ITR_ENABLED: 'false'
  DD_TRACE_DEBUG: '0'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Install JavaScript dependencies
        working-directory: javascript
        run: npm ci

      - name: Install Playwright browsers
        working-directory: javascript
        run: npx playwright install chromium

      - name: Lint Python
        run: ruff check python/src

      - name: Lint JavaScript
        working-directory: javascript
        run: npm run lint

      - name: Build frontend
        working-directory: javascript
        run: npm run build

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run Python tests (serial, no TIA)
        working-directory: python
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pulse-api-baseline
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
          PYTEST_ADDOPTS: --ddtrace
        run: pytest tests/ -v

      - name: Run JavaScript tests (serial, no TIA)
        working-directory: javascript
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pulse-frontend-baseline
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}
        run: npm run test:all

      - name: Start API for E2E
        working-directory: python
        env:
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
          PYTHONPATH: src
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Start frontend for E2E
        working-directory: javascript
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm run preview -- --host 0.0.0.0 --port 5173 &
          sleep 5

      - name: Run Playwright E2E (serial)
        working-directory: javascript
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: pulse-e2e-baseline
          PULSE_BASE_URL: http://localhost:5173
        run: npm run test:e2e
