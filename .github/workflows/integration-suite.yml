name: Integration Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot services
        run: |
          echo "Starting Postgres..."
          sleep 10
          echo "Starting Redis cache..."
          sleep 10
          echo "Warming API..."
          sleep 10
          echo "Setup complete"

  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r python/requirements.txt
          cd javascript && npm ci

      - name: Configure Datadog Test Optimization (Python)
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run Python slow integration tests
        working-directory: python
        run: pytest tests/slow tests/integration -v
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: integration-python
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test

      - name: Configure Datadog Test Optimization (JavaScript)
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run JavaScript slow tests
        working-directory: javascript
        run: npm run test:slow
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: integration-javascript
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  teardown:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Cleanup
        run: |
          echo "Tearing down services..."
          sleep 5
          echo "Cleanup complete"
