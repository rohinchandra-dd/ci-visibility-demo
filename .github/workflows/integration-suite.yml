name: Integration Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot services
        run: |
          echo "Starting database..."
          sleep 10
          echo "Starting cache..."
          sleep 10
          echo "Starting message queue..."
          sleep 10
          echo "Services ready"

  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Install JavaScript dependencies
        working-directory: javascript
        run: npm ci

      - name: Configure Datadog Test Optimization (Python)
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run Python slow tests
        working-directory: python
        run: pytest tests/test_slow.py -v
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: integration-python

      - name: Run JavaScript slow tests
        working-directory: javascript
        run: npm run test:slow
        env:
          DD_ENV: ci-visibility-demo
          DD_SERVICE: integration-javascript
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  teardown:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Clean up services
        run: |
          echo "Stopping services..."
          sleep 5
          echo "Cleanup complete"
